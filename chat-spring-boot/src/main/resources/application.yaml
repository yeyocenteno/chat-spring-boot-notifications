server:
  port: ${PORT:8082}

spring:
  application:
    name: opselling_operative_plane

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5433/chat_db}
    username: ${DATASOURCE_USERNAME:postgres}
    password: ${DATASOURCE_PASSWORD:DSC2003p}
    driver-class-name: ${DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

    hikari:
      # Connection Pool Configuration
      pool-name: HikariPoolSpringBootChat
      maximum-pool-size: 20

  jpa:
    # JPA Configuration
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    database: POSTGRESQL
    generate-ddl: true
    show-sql: true

    # Hibernate Properties (Explicit & Production-Ready)
    properties:
      hibernate:
        # Dialect & SQL
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: ${DATASOURCE_SCHEMA:public}

        # SQL Formatting & Logging
        format_sql: true
        use_sql_comments: true
        highlight_sql: true
        show_sql: true

        # JDBC & Batch Settings
        jdbc:
          time_zone: UTC

  # Configuración de Correo (Integrada correctamente bajo 'spring')
  mail:
    host: smtp.gmail.com
    port: 465
    username: "pracdsc@gmail.com"
    password: "ykzx rslr zspv orpo"
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: false

# Configuración de Firebase (Va fuera de 'spring' porque es una propiedad personalizada)
